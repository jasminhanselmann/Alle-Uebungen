<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blattwerk – Jasmin Hanselmann</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="kopf">
    <h1>Blattwerk</h1>
  </header>

  <main>
    <div class="wand">

      <figure class="bild">
        <div class="blatt"><img src="images/ahorn.jpg" alt="Blatt eines Berg-Ahorns"></div>
        <figcaption>
          <span class="nr">Nr. 01</span>
          <span class="name">Berg-Ahorn</span>
          <span class="latein">Acer pseudoplatanus</span>
        </figcaption>
      </figure>

      <figure class="bild">
        <div class="blatt"><img src="images/birke.jpg" alt="Blatt einer Hänge-Birke"></div>
        <figcaption>
          <span class="nr">Nr. 02</span>
          <span class="name">Hänge-Birke</span>
          <span class="latein">Betula pendula</span>
        </figcaption>
      </figure>

      <figure class="bild">
        <div class="blatt"><img src="images/birnenbaum.jpg" alt="Blatt eines Birnbaums"></div>
        <figcaption>
          <span class="nr">Nr. 03</span>
          <span class="name">Birnbaum</span>
          <span class="latein">Pyrus communis</span>
        </figcaption>
      </figure>

      <figure class="bild">
        <div class="blatt"><img src="images/buche.jpg" alt="Zweig einer Rotbuche"></div>
        <figcaption>
          <span class="nr">Nr. 04</span>
          <span class="name">Rotbuche</span>
          <span class="latein">Fagus sylvatica</span>
        </figcaption>
      </figure>

      <figure class="bild">
        <div class="blatt"><img src="images/eiche.jpg" alt="Blätter einer Stieleiche"></div>
        <figcaption>
          <span class="nr">Nr. 05</span>
          <span class="name">Stieleiche</span>
          <span class="latein">Quercus robur</span>
        </figcaption>
      </figure>

      <figure class="bild">
        <div class="blatt"><img src="images/kastanienbaum.jpg" alt="Blatt einer Rosskastanie"></div>
        <figcaption>
          <span class="nr">Nr. 06</span>
          <span class="name">Rosskastanie</span>
          <span class="latein">Aesculus hippocastanum</span>
        </figcaption>
      </figure>

      <figure class="bild">
        <div class="blatt"><img src="images/kirsche.jpg" alt="Blatt eines Kirschbaums"></div>
        <figcaption>
          <span class="nr">Nr. 07</span>
          <span class="name">Kirschbaum</span>
          <span class="latein">Prunus avium</span>
        </figcaption>
      </figure>

      <figure class="bild">
        <div class="blatt"><img src="images/linde.jpg" alt="Blatt und Früchte einer Winterlinde"></div>
        <figcaption>
          <span class="nr">Nr. 08</span>
          <span class="name">Winterlinde</span>
          <span class="latein">Tilia cordata</span>
        </figcaption>
      </figure>

      <figure class="bild">
        <div class="blatt"><img src="images/nussbaum.jpg" alt="Blatt eines Walnussbaums"></div>
        <figcaption>
          <span class="nr">Nr. 09</span>
          <span class="name">Walnussbaum</span>
          <span class="latein">Juglans regia</span>
        </figcaption>
      </figure>

      <figure class="bild">
        <div class="blatt"><img src="images/pappel.jpg" alt="Zweig einer Pappel"></div>
        <figcaption>
          <span class="nr">Nr. 10</span>
          <span class="name">Pappel</span>
          <span class="latein">Populus</span>
        </figcaption>
      </figure>

    </div>
  </main>

  <footer class="fuss">
    <p>Jasmin Hanselmann</p>
  </footer>

</body>

</html>
