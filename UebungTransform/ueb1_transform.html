<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uebung Transformationen</title> 
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section>
  <h1>verschoben</h1>
  <div class="group">
    <div class="not_transformed"></div>
    <div class="transformed verschoben">Hallo</div>
  </div>
</section>

<section>
  <h1>rotieren</h1>
  <div class="group">
    <div class="not_transformed"></div>
    <div class="transformed rotieren">Grüezi</div>
  </div>
</section>

<section>
  <h1>Skalieren</h1>
  <div class="group">
    <div class="not_transformed"></div>
    <div class="transformed Skalieren">Kamusta</div>
  </div>
</section>

<section>
  <h1>Skew</h1>
  <div class="group">
    <div class="not_transformed"></div>
    <div class="transformed Skew">Buongiorno</div>
  </div>
</section>

</body>
</html>
